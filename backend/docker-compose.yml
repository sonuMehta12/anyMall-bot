# docker-compose.yml
#
# PostgreSQL 16 for local development (Phase 1C).
#
# The backend owns its database — this file lives in backend/.
# Frontend has no database needs (it talks to the backend API).
#
# Usage:
#   docker compose up -d          Start PostgreSQL in the background
#   docker compose down            Stop PostgreSQL (data is kept)
#   docker compose down -v         Stop AND delete all data (fresh start)
#   docker compose ps              Check if container is running
#   docker compose logs postgres   View PostgreSQL logs
#
# Connect manually:
#   docker exec -it anymall-postgres psql -U anymall -d anymallchan

services:
  postgres:
    image: postgres:16-alpine
    container_name: anymall-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: anymallchan
      POSTGRES_USER: anymall
      POSTGRES_PASSWORD: anymall_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anymall -d anymallchan"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    # NOTE: Valkey has no persistent volume — this is intentional.
    # Valkey is a cache layer only; PostgreSQL is the source of truth.
    # On container restart all cached data is lost; the first request after
    # restart will be a cache miss and reload from PostgreSQL (cache-aside).
    # To inspect cache: docker exec -it anymall-valkey valkey-cli -a ${VALKEY_PASSWORD:-valkey_dev}
    image: valkey/valkey:8-alpine
    container_name: anymall-valkey
    # maxmemory: 64MB is more than enough for our session/profile cache footprint
    # (~1.25MB estimated + 10x safety margin = 12.5MB; 64MB gives plenty of headroom)
    # allkeys-lru: evict least-recently-used key from ALL keys when memory is full.
    # This is the industry-standard eviction policy for caching workloads.
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD:-valkey_dev}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:-valkey_dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
